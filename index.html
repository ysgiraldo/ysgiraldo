<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGC — Data Scientist · AI</title>
<meta name="description" content="Portfolio of Sofia Giraldo — Data Scientist focused on data, cloud, AI and quantum computing.">

<script>
(function(){
  try{
    var t = localStorage.getItem('site-theme');
    if(t !== 'light' && t !== 'dark'){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper: #f9f8f4;
    --paper-line: #ded9cd;
    --ink: #1b1e24;
    --ink-soft: #4a4e57;
    --muted: #767b84;
    --blue: #2b4c7e;
    --blue-soft: #7691b3;
    --blue-wash: #e8edf4;
    --blue-deep: #2b4c7e;
    --surface: #ffffff;
    --max-w: 780px;
    --edge: 1px solid var(--paper-line);
  }

  :root[data-theme="dark"]{
    --paper: #14171c;
    --paper-line: #2a2f38;
    --ink: #e7e5df;
    --ink-soft: #b7bcc4;
    --muted: #838a93;
    --blue: #7fa8d9;
    --blue-soft: #4d6c92;
    --blue-wash: #1f2c3d;
    --blue-deep: #3d6096;
    --surface: #1b1f26;
  }

  body, header, .btn, .content-card, .tags li, .content-card__meta span, .term-toggle, .theme-toggle button, .lang-toggle button{
    transition: background-color .2s ease, color .2s ease, border-color .2s ease;
  }

  *,*::before,*::after{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  body::before{
    content:"";
    position: fixed;
    inset:0;
    z-index:-1;
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity: 0.35;
  }

  a{ color: var(--blue); }

  h1,h2,h3{
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    line-height: 1.15;
    margin: 0;
  }

  .wrap{ max-width: var(--max-w); margin: 0 auto; padding: 0 28px; }

  /* ---------- header / nav ---------- */
  header{
    position: sticky; top:0; z-index: 30;
    background: rgba(249,248,244,0.9);
    backdrop-filter: blur(6px);
    border-bottom: var(--edge);
  }
  header .wrap{ display:flex; align-items:center; justify-content: space-between; height: 64px; }
  .brand{ font-family:"Fraunces", serif; font-weight: 600; font-size: 17px; text-decoration:none; color: var(--ink); }
  nav ul{ list-style:none; display:flex; gap: 24px; margin:0; padding:0; }
  nav a{
    color: var(--ink-soft); text-decoration:none; font-size: 14.5px;
    position: relative; padding: 4px 2px;
  }
  nav a:hover, nav a:focus-visible{ color: var(--blue); }
  nav a.is-active{ color: var(--blue); }
  nav a.is-active::after{
    content:""; position:absolute; left:0; right:0; bottom:-14px;
    height:2px; background: var(--blue);
  }

  .lang-toggle{
    display:flex; border: 1px solid var(--paper-line); border-radius: 3px; overflow:hidden;
    font-family: "IBM Plex Mono", monospace; font-size: 12px; flex-shrink:0;
  }
  .lang-toggle button{
    background:none; border:none; padding: 7px 11px; cursor:pointer; color: var(--muted);
    font-family: inherit; font-size: inherit; transition: background-color .15s ease, color .15s ease;
  }
  .lang-toggle button + button{ border-left: 1px solid var(--paper-line); }
  .lang-toggle button:hover{ color: var(--blue); }
  .lang-toggle button.is-active{ background: var(--blue); color:#fff; }

  .header-controls{ display:flex; align-items:center; gap:10px; flex-shrink:0; }

  /* ---------- page shell / transitions ---------- */
  main{ min-height: calc(100vh - 64px - 60px); position: relative; }
  .page{ padding: 72px 0 96px; }
  .page.is-entering{ animation: pageIn .5s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes pageIn{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .page.is-entering{ animation: none; }
  }

  .callout{ position: relative; display:inline-block; padding: 2px 0 2px 16px; margin-bottom: 40px; }
  .callout::before, .callout::after{ content:""; position:absolute; left:0; width:9px; height:9px; border-left: 2px solid var(--blue); }
  .callout::before{ top:-6px; border-top: 2px solid var(--blue); }
  .callout::after{ bottom:-6px; border-bottom: 2px solid var(--blue); }
  .callout span{ font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--blue); letter-spacing: 0.02em; }
  .callout h2{ font-size: 28px; margin-top: 6px; }

  /* ---------- hero (home) ---------- */
  .hero{ display:grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; align-items:center; padding-top: 16px; }
  .hero__eyebrow{ font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--blue); margin-bottom: 18px; display:block; }
  .hero h1{ font-size: clamp(38px, 6vw, 58px); letter-spacing: -0.01em; }
  .hero__role{ color: var(--ink-soft); font-size: 20px; margin: 18px 0 24px; max-width: 46ch; }
  .hero__actions{ display:flex; gap: 14px; flex-wrap: wrap; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding: 12px 20px; border-radius: 3px;
    font-size: 15px; text-decoration:none; border: 1px solid transparent; cursor:pointer;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
    font-family: inherit;
  }
  .btn--primary{ background: var(--blue-deep); color: #fff; }
  .btn--primary:hover, .btn--primary:focus-visible{ background: #223d63; }
  .btn--ghost{ border-color: var(--paper-line); color: var(--ink); background: transparent; }
  .btn--ghost:hover, .btn--ghost:focus-visible{ border-color: var(--blue); color: var(--blue); }

  .schematic{ width:100%; height:auto; color: var(--blue-soft); }
  .schematic path{ stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.6s ease forwards; }
  .schematic circle{ stroke-dashoffset: 0; animation: nodeIn .4s ease 1.1s both; }
  @keyframes draw{ to{ stroke-dashoffset: 0; } }
  @keyframes nodeIn{ from{ opacity:0; } to{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .schematic path, .schematic circle{ animation: none; stroke-dashoffset:0; opacity:1; } }

  .quicklinks{ list-style:none; display:flex; gap:14px; flex-wrap:wrap; margin: 40px 0 0; padding:0; }
  .quicklinks a{
    display:flex; flex-direction:column; gap:4px; text-decoration:none; color: var(--ink);
    border: 1px solid var(--paper-line); border-radius:3px; padding: 14px 18px; min-width: 140px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .quicklinks a:hover, .quicklinks a:focus-visible{ border-color: var(--blue); transform: translateY(-2px); }
  .quicklinks .num{ font-family:"IBM Plex Mono", monospace; font-size:12px; color: var(--blue); }
  .quicklinks .lbl{ font-family:"Fraunces", serif; font-size:16px; }

  /* ---------- about ---------- */
  .about{ display:grid; grid-template-columns: 1.5fr 1fr; gap: 48px; }
  .about p{ color: var(--ink-soft); max-width: 58ch; }
  .facts{ list-style:none; margin:0; padding:0; }
  .facts li{ display:flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--paper-line); font-size: 14.5px; }
  .facts li:first-child{ padding-top:0; }
  .facts dt{ color: var(--muted); } .facts dd{ margin:0; text-align:right; }

  /* ---------- experience timeline ---------- */
  .timeline{ list-style:none; margin:0; padding:0; border-left: 2px solid var(--blue-wash); }
  .timeline__item{ position: relative; padding: 0 0 44px 32px; }
  .timeline__item:last-child{ padding-bottom:0; }
  .timeline__item::before{ content:""; position:absolute; left:-7px; top: 4px; width:12px; height:12px; background: var(--paper); border: 2px solid var(--blue); border-radius:50%; }
  .timeline__date{ font-family:"IBM Plex Mono", monospace; font-size: 13px; color: var(--blue); display:block; margin-bottom: 6px; }
  .timeline__role{ font-size: 19px; font-weight:600; margin: 0 0 2px; font-family:"Fraunces", serif; }
  .timeline__org{ color: var(--muted); font-size: 15px; margin: 0 0 10px; }
  .timeline__item p{ color: var(--ink-soft); max-width: 56ch; margin: 0 0 10px; }
  .timeline__item ul{ margin: 0; padding-left: 18px; color: var(--ink-soft); font-size: 15px; }
  .timeline__item li + li{ margin-top:4px; }

  /* ---------- skills ---------- */
  .skill-group + .skill-group{ margin-top: 26px; }
  .skill-group h3{ font-family:"IBM Plex Sans", sans-serif; font-weight:600; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .tags{ list-style:none; display:flex; flex-wrap:wrap; gap:10px; margin:0; padding:0; }
  .tags li{ font-family:"IBM Plex Mono", monospace; font-size: 13.5px; padding: 6px 12px; border: 1px solid var(--paper-line); border-radius: 3px; color: var(--ink-soft); background: var(--surface); }

  /* ---------- projects (processes, documents, files) ---------- */
  .content-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0; }
  .content-card{
    display:grid; grid-template-columns: 96px 1fr; gap: 20px;
    padding: 26px 0; border-bottom: 1px solid var(--paper-line);
  }
  .content-card:first-child{ padding-top:0; }
  .content-card__kind{
    font-family:"IBM Plex Mono", monospace; font-size: 12px; color: var(--blue);
    text-transform: uppercase; letter-spacing: 0.04em; padding-top: 3px;
  }
  .content-card__title{ font-family:"Fraunces", serif; font-size: 19px; margin: 0 0 6px; }
  .content-card p{ color: var(--ink-soft); margin: 0 0 10px; max-width: 58ch; font-size: 15.5px; }
  .content-card__meta{ display:flex; flex-wrap:wrap; gap: 8px; margin-bottom: 10px; }
  .content-card__meta span{
    font-family:"IBM Plex Mono", monospace; font-size: 12px; color: var(--muted);
    border: 1px solid var(--paper-line); border-radius: 3px; padding: 3px 8px; background:var(--surface);
  }
  .content-card__link{ font-size: 14.5px; text-decoration:none; font-weight:500; }
  .content-card__link:hover, .content-card__link:focus-visible{ text-decoration: underline; }

  /* ---------- contact ---------- */
  .contact__grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 16px 32px; }
  .contact__link{ display:flex; justify-content: space-between; align-items:center; padding: 16px 0; border-bottom: 1px solid var(--paper-line); text-decoration:none; color: var(--ink); }
  .contact__link:hover, .contact__link:focus-visible{ color: var(--blue); }
  .contact__label{ color: var(--muted); font-size: 13px; font-family:"IBM Plex Mono", monospace; }
  .contact__value{ font-size: 16px; }

  /* ---------- sheet index (bottom-right, blueprint-sheet convention) ---------- */
  .sheet-index{
    position: fixed; right: 20px; bottom: 20px; z-index: 20;
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted);
    background: var(--paper); border: 1px solid var(--paper-line); border-radius: 3px;
    padding: 8px 12px; display:flex; align-items:center; gap:10px;
  }
  .sheet-index button{
    background:none; border:none; color: var(--blue); cursor:pointer; font-family: inherit; font-size: 14px;
    padding: 0 4px; line-height:1;
  }
  .sheet-index button:disabled{ color: var(--paper-line); cursor:default; }

  footer{ padding: 32px 0 48px; text-align:center; color: var(--muted); font-size: 13.5px; }

  /* ---------- terminal easter egg ---------- */
  .term-toggle{
    position: fixed; left: 20px; bottom: 20px; z-index: 20;
    font-family: "IBM Plex Mono", monospace; font-size: 13px;
    background: #14171c; color: #d8e4f2; border: none; border-radius: 3px;
    padding: 10px 14px; cursor: pointer;
  }
  .term-toggle:hover{ background:#2a2f38; }
  .terminal{
    position: fixed; left: 20px; bottom: 68px; z-index: 25;
    width: min(420px, calc(100vw - 40px)); max-height: 340px;
    background: #14171c; color: #d8e4f2; border-radius: 6px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    font-family:"IBM Plex Mono", monospace; font-size: 13px;
    display: none; flex-direction: column; overflow:hidden;
    border: 1px solid #2a2f38;
  }
  .terminal.is-open{ display:flex; }
  .terminal__bar{ display:flex; align-items:center; gap:6px; padding:8px 10px; background:#1b1f26; }
  .terminal__dot{ width:9px; height:9px; border-radius:50%; background:#3a4150; }
  .terminal__title{ margin-left:6px; color:#7691b3; font-size:12px; }
  .terminal__body{ padding: 12px; overflow-y:auto; flex:1; }
  .terminal__line{ margin: 0 0 6px; white-space: pre-wrap; word-break: break-word; }
  .terminal__form{ display:flex; align-items:center; gap:8px; padding: 8px 12px; border-top: 1px solid #2a2f38; }
  .terminal__form span{ color:#7691b3; }
  .terminal__input{
    flex:1; background:none; border:none; color:#d8e4f2; font-family:inherit; font-size:13px;
  }
  .terminal__input:focus{ outline:none; }

  :focus-visible{ outline: 2px solid var(--blue); outline-offset: 3px; }

  @media (max-width: 720px){
    .hero{ grid-template-columns: 1fr; }
    .hero__visual{ order:-1; max-width: 220px; }
    .about{ grid-template-columns: 1fr; }
    .contact__grid{ grid-template-columns: 1fr; }
    header .wrap{ flex-wrap: wrap; height:auto; padding-top:10px; padding-bottom:10px; gap:10px; }
    nav ul{ gap: 12px; }
    nav a{ font-size: 12.5px; }
    .header-controls{ gap:6px; }
    .lang-toggle button{ padding:5px 8px; }
    .page{ padding: 48px 0 72px; }
    .sheet-index{ font-size: 11px; padding: 6px 10px; }
  }
</style>
</head>

/* ══════════════════════════════════════════════════════════════
   ROUTER — each "page" is an entry in the ROUTES array
   ══════════════════════════════════════════════════════════════ */
const ROUTES = [
  { path: '/',             key: 'home',       label: { en: 'Home', es: 'Inicio' } },
  { path: '/experience',   key: 'experience', label: { en: 'Experience', es: 'Experiencia' } },
  { path: '/skills',       key: 'skills',     label: { en: 'Education', es: 'Educación' } },
  { path: '/projects',     key: 'projects',   label: { en: 'Projects and documents', es: 'Proyectos y documentos' } },
  { path: '/contact',      key: 'contact',    label: { en: 'Contact', es: 'Contacto' } },
];

const FOOTER_TEXT = {
  en: 'Sofia Giraldo — Copyright 2026 <br>"Discipline sooner or later will defeat intelligence"',
  es: 'Sofia Giraldo — Copyright 2026 <br>"La disciplina, tarde o temprano, vencerá a la inteligencia"',
};

function getLang(){
  try{
    const saved = localStorage.getItem('site-lang');
    if(saved === 'en' || saved === 'es') return saved;
  }catch(e){}
  return 'en';
}
function setLang(l){
  try{ localStorage.setItem('site-lang', l); }catch(e){}
}
function getTheme(){
  const current = document.documentElement.getAttribute('data-theme');
  return (current === 'dark' || current === 'light') ? current : 'light';
}
function setThemeStorage(t){
  try{ localStorage.setItem('site-theme', t); }catch(e){}
}
let theme = getTheme();

const themeToggle = document.getElementById('themeToggle');
function updateThemeButtons(){
  if(!themeToggle) return;
  themeToggle.querySelectorAll('button').forEach(b=>{
    b.classList.toggle('is-active', b.dataset.themeChoice === theme);
  });
}
updateThemeButtons();

if(themeToggle){
  themeToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-theme-choice]');
    if(!btn || btn.dataset.themeChoice === theme) return;
    theme = btn.dataset.themeChoice;
    document.documentElement.setAttribute('data-theme', theme);
    setThemeStorage(theme);
    updateThemeButtons();
  });
}

let lang = getLang();

const mainEl = document.getElementById('main');
const sheetLabel = document.getElementById('sheetLabel');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

const navList = document.getElementById('navList');
const footerText = document.getElementById('footerText');
const langToggle = document.getElementById('langToggle');

const SHEET_WORD = { en: 'SHEET', es: 'HOJA' };
const PAGE_ARIA = {
  en: { prev: 'Previous page', next: 'Next page' },
  es: { prev: 'Página anterior', next: 'Página siguiente' },
};

function currentIndex(){
  const hash = location.hash.replace('#','') || '/';
  const idx = ROUTES.findIndex(r => r.path === hash);
  return idx === -1 ? 0 : idx;
}

function renderNav(){
  navList.innerHTML = ROUTES.filter(r => r.key !== 'home').map(r =>
    `<li><a href="#${r.path}" data-route="${r.key}">${r.label[lang]}</a></li>`
  ).join('');
}

function render(){
  const idx = currentIndex();
  const route = ROUTES[idx];
  const PAGES = CONTENT[lang];
  const html = PAGES[route.key]();

  document.documentElement.lang = lang;
  renderNav();

  mainEl.innerHTML = `<div class="page is-entering">${html}</div>`;
  mainEl.focus();

  document.querySelectorAll('#nav a').forEach(a=>{
    a.classList.toggle('is-active', a.dataset.route === route.key);
  });

  document.querySelectorAll('.lang-toggle button').forEach(b=>{
    b.classList.toggle('is-active', b.dataset.lang === lang);
  });

  if(footerText) footerText.innerHTML = FOOTER_TEXT[lang];

  if(sheetLabel){
    sheetLabel.textContent = `${SHEET_WORD[lang]} ${String(idx+1).padStart(2,'0')} / ${String(ROUTES.length).padStart(2,'0')}`;
  }
  if(prevBtn){
    prevBtn.disabled = idx === 0;
    prevBtn.setAttribute('aria-label', PAGE_ARIA[lang].prev);
  }
  if(nextBtn){
    nextBtn.disabled = idx === ROUTES.length - 1;
    nextBtn.setAttribute('aria-label', PAGE_ARIA[lang].next);
  }

  window.scrollTo(0, 0);
}

langToggle.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if(!btn || btn.dataset.lang === lang) return;
  lang = btn.dataset.lang;
  setLang(lang);
  render();
});

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  if(!location.hash) location.hash = '#/';
  render();
});

if(prevBtn){
  prevBtn.addEventListener('click', () => {
    const idx = currentIndex();
    if(idx > 0) location.hash = '#' + ROUTES[idx-1].path;
  });
}
if(nextBtn){
  nextBtn.addEventListener('click', () => {
    const idx = currentIndex();
    if(idx < ROUTES.length - 1) location.hash = '#' + ROUTES[idx+1].path;
  });
}

window.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  const idx = currentIndex();
  if(e.key === 'ArrowRight' && idx < ROUTES.length - 1) location.hash = '#' + ROUTES[idx+1].path;
  if(e.key === 'ArrowLeft' && idx > 0) location.hash = '#' + ROUTES[idx-1].path;
});

/* ══════════════════════════════════════════════════════════════
   TERMINAL — a small easter egg for whoever explores the console
   ══════════════════════════════════════════════════════════════ */

const terminal = document.getElementById('terminal');

function printLine(text){
  const p = document.createElement('p');
  p.className = 'terminal__line';
  p.textContent = text;
  termBody.appendChild(p);
  termBody.scrollTop = termBody.scrollHeight;
}

  help: () => 'Commands: help, whoami, experience, education, projects, contact, cv, links, go <page>, clear',

    const target = ROUTES.find(r =>
      r.key.includes(q) || r.label.en.toLowerCase().includes(q) || r.label.es.toLowerCase().includes(q)
    );
    printLine(target ? `Opening ${target.label.en} ...` : 'Couldn\'t find that page. Try: experience, education, projects, contact');
    if(target) location.hash = '#' + target.path;
  } else if(COMMANDS[cmd]){
    const out = COMMANDS[cmd]();
    if(out) printLine(out);
  } else {
    printLine(`command not found: ${cmd} (type "help")`);
  }
  termInput.value = '';
});

termToggle.addEventListener('click', () => {
  const open = terminal.classList.toggle('is-open');
  termToggle.setAttribute('aria-expanded', String(open));
  if(open) termInput.focus();
});
</script>
</body>
</html>
